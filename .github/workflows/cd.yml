name: CD Workflow

on:
  workflow_run: # Triggered when the CI workflow is completed
    workflows: ["CI Workflow"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script:
            git clone https://github.com/mailmeabhishek/github-action-demo-three-tier-app.git
            cd ~/github-action-demo-three-tier-app
            docker compose pull
            docker compose down && docker compose up -d
